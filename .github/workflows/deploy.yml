
name: Deploy OrderFlow to EC2

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

concurrency:
  group: orderflow-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via AWS SSM
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AWS_REGION: ap-southeast-2
      EC2_INSTANCE_ID: i-03ae823694b9f4a05

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::936573659894:role/GitHubActionsOrderFlowDeployRole
          aws-region: ap-southeast-2

      - name: Prepare deployment command
        run: |
          python3 - <<'PY'
          import json

          script = """#!/bin/bash
          set -euo pipefail

          runuser -u ubuntu -- /bin/bash <<'DEPLOY'
          set -euo pipefail

          export HOME=/home/ubuntu
          export PATH=/home/ubuntu/.nvm/versions/node/v24.20.0/bin:/usr/local/bin:/usr/bin:/bin

          cd /home/ubuntu/OrderFlow

          git fetch origin main
          git merge --ff-only origin/main

          npm ci
          npm run build

          pm2 restart orderflow
          pm2 save
          DEPLOY
          """

          with open("ssm-params.json", "w") as f:
              json.dump({"commands": [script]}, f)
          PY

      - name: Deploy and check result
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --timeout-seconds 1800 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          for attempt in $(seq 1 150); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query "[StandardOutputContent,StandardErrorContent]" \
                  --output text
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Deployment wait timed out"
          exit 1
